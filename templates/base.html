<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DSA Debugger{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            background: #161b22;
            border-radius: 16px;
            padding: 40px;
            max-width: 1000px;
            width: 100%;
            border: 1px solid #30363d;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            margin: 20px 0;
        }
        .back-link {
            display: inline-block;
            color: #58a6ff;
            text-decoration: none;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        h1 {
            font-size: 28px;
            color: #58a6ff;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #8b949e;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .subtitle span {
            background: #21262d;
            padding: 4px 12px;
            border-radius: 20px;
            font-family: monospace;
            color: #f0883e;
        }
        textarea {
            width: 100%;
            background: #0d1117;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            min-height: 250px;
            outline: none;
            transition: border 0.3s;
        }
        textarea:focus {
            border-color: #58a6ff;
        }
        textarea::placeholder {
            color: #484f58;
        }
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 24px 0;
        }
        .result-card {
            background: #0d1117;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #30363d;
        }
        .result-card .label {
            color: #8b949e;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .result-card .value {
            font-size: 24px;
            font-weight: 700;
            margin-top: 8px;
            font-family: 'Courier New', monospace;
        }
        .time-value {
            color: #f0883e;
        }
        .space-value {
            color: #58a6ff;
        }
        .graph-section {
            margin: 24px 0;
            background: #0d1117;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #30363d;
            text-align: center;
        }
        .graph-section .label {
            color: #8b949e;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 16px;
            display: block;
        }
        .graph-section img {
            max-width: 100%;
            border-radius: 8px;
        }
        .graph-section .no-data {
            color: #484f58;
            padding: 40px 0;
            font-style: italic;
        }
        .code-section {
            margin: 24px 0;
        }
        .code-section .label {
            color: #8b949e;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }
        pre {
            background: #0d1117;
            border-radius: 8px;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            overflow-x: auto;
            border: 1px solid #21262d;
            color: #c9d1d9;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: #238636;
            color: white;
        }
        .btn-primary:hover {
            background: #2ea043;
        }
        .btn-secondary {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }
        .btn-secondary:hover {
            background: #30363d;
        }
        .alert {
            background: rgba(248, 81, 73, 0.12);
            color: #ff7b72;
            border: 1px solid rgba(248, 81, 73, 0.35);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .examples {
            margin-top: 16px;
            padding: 16px;
            background: #0d1117;
            border-radius: 8px;
            border: 1px solid #21262d;
        }
        .examples p {
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .examples code {
            display: block;
            background: #161b22;
            padding: 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #f0883e;
            margin-top: 4px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: border 0.2s;
        }
        .examples code:hover {
            border-color: #58a6ff;
        }
        .footer {
            margin-top: 24px;
            color: #484f58;
            font-size: 12px;
            text-align: center;
            border-top: 1px solid #21262d;
            padding-top: 16px;
        }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
